name: Keepalive (не даёт отключить расписание)

# GitHub отключает cron-расписание в ПУБЛИЧНЫХ репозиториях после 60 дней
# без активности. Этот workflow раз в месяц делает пустой коммит,
# чтобы «Весы» публиковали посты годами без вашего участия.

on:
  schedule:
    # 1-е число каждого месяца, 04:17 UTC (07:17 МСК)
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Touch keepalive file
        run: |
          mkdir -p .github
          date -u +"Last keepalive: %Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "::notice::Изменений нет"
          else
            git commit -m "chore: keepalive [skip ci]"
            git push
            echo "::notice::Keepalive обновлён — расписание остаётся активным"
          fi
