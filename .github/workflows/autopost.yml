name: Libra Content Factory Autopost

on:
  # ── Расписание (время МСК = UTC+3) ────────────────────────────────────
  # 07:30  прогноз дня           (30 4 * * *)
  # 09:30  Луна сегодня          (30 6 * * *)
  # 12:30  Любовь с Весами       (30 9 * * *)
  # 15:30  Бизнес и деньги       (30 12 * * *)
  # 18:30  Тест «Какой вы Весы»  (30 15 * * *)  ← создаёт комментарии
  # 21:00  Секс и чувственность  (0 18 * * *)   ← лучшее время для этой темы
  # 21:15  вечерняя ротация      (15 18 * * *)  ← таро / венера / неделя
  # 23:50  дайджест месяца       (50 20 * * *)  ← ТОЛЬКО в последний день месяца
  #        (в месячном режиме: любовь → секс → бизнес подряд)
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 6 * * *"
    - cron: "30 9 * * *"
    - cron: "30 12 * * *"
    - cron: "30 15 * * *"
    - cron: "0 18 * * *"
    - cron: "15 18 * * *"
    - cron: "50 20 * * *"

  workflow_dispatch:
    inputs:
      slot:
        description: "Какую рубрику сгенерировать"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - day
          - evening
          - forecast
          - tarot
          - love
          - venus
          - week_ahead
          - sex
          - love_daily
          - business
          - quiz
          - moon
          - month_digest
      dry_run:
        description: "Тестовый прогон без публикации в Telegram"
        required: true
        default: false
        type: boolean

  # Автозапуск при правке самого workflow — регистрирует файл в GitHub,
  # чтобы кнопка «Run workflow» появилась сразу. Пост не публикуется.
  push:
    paths:
      - ".github/workflows/autopost.yml"

permissions:
  contents: write
  models: read

jobs:
  publish-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ────────────────────────────────────────────────────────────────
      # Самовосстановление структуры: если файлы лежат «плоско» или
      # отсутствует requirements.txt, но в корне есть
      # libra-content-factory.zip — проект распаковывается автоматически.
      # ────────────────────────────────────────────────────────────────
      - name: Bootstrap / автообновление кода из архива
        shell: bash
        run: |
          set -u
          ZIP=libra-content-factory.zip

          ROOT_OK=1
          if [ ! -f requirements.txt ] || [ ! -f src/main.py ] || [ ! -f src/content_extras.py ]; then
            ROOT_OK=0
          fi

          if [ ! -f "$ZIP" ]; then
            if [ "$ROOT_OK" = "1" ]; then
              echo "::notice::Код в порядке, архив не загружен — обновление не требуется (версия $(cat VERSION 2>/dev/null || echo '?'))"
              exit 0
            fi
            echo "::error::Структура нарушена (нет src/main.py или src/content_extras.py),"
            echo "::error::и в корне нет libra-content-factory.zip."
            echo "::error::Загрузите архив: Add file → Upload files → libra-content-factory.zip → Commit changes."
            exit 1
          fi

          echo "::notice::В корне найден libra-content-factory.zip — проверяю версию кода"
          rm -rf .unpack && mkdir -p .unpack
          unzip -q -o "$ZIP" -d .unpack
          SRC_DIR=".unpack/libra-content-factory"
          [ -d "$SRC_DIR" ] || SRC_DIR=".unpack"

          NEW_VER="$(cat "$SRC_DIR/VERSION" 2>/dev/null || echo unknown)"
          CUR_VER="$(cat VERSION 2>/dev/null || echo none)"
          echo "::notice::Версия в архиве: $NEW_VER | в репозитории: $CUR_VER | структура ок: $ROOT_OK"

          if [ "$NEW_VER" = "$CUR_VER" ] && [ "$ROOT_OK" = "1" ]; then
            echo "::notice::Код уже актуален — распаковка не нужна, просто убираю архив"
            rm -rf .unpack
            rm -f "$ZIP"
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: remove redundant libra-content-factory.zip [skip ci]" || echo "нечего коммитить"
            git push || echo "::warning::push не удался (не критично)"
            exit 0
          fi

          echo "::notice::Распаковываю архив — код будет обновлён до $NEW_VER"
          cp -a "$SRC_DIR"/. .
          rm -rf .unpack

          # GITHUB_TOKEN НЕ имеет права менять файлы .github/workflows —
          # вернём их к состоянию из репозитория, иначе git push будет отклонён.
          git checkout -- .github/workflows 2>/dev/null || true
          git clean -fdq .github/workflows 2>/dev/null || true

          # Убираем «плоские» дубли от старых загрузок
          rm -f __init__.py astro_engine.py card_generator.py fallback_writer.py llm_client.py \
                main.py telegram_publisher.py content_extras.py content_plan.md history.json \
                last_post.json test_factory.py libra_avatar.png card_2026-*.png || true
          rm -f "$ZIP"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update factory code from zip to $NEW_VER [skip ci]" || echo "нечего коммитить"
          git push || echo "::warning::push не удался — код обновлён только для этого запуска"

          echo "::notice::Код обновлён до версии $NEW_VER (текущая: $(cat VERSION 2>/dev/null))"

      - name: Verify repository layout
        shell: bash
        run: |
          echo "=== Содержимое корня ==="
          ls -la
          echo "=== Версия кода: $(cat VERSION 2>/dev/null || echo 'НЕ ЗАДАНА (старое ядро)') ==="
          for f in requirements.txt src/main.py src/astro_engine.py src/card_generator.py \
                   src/llm_client.py src/fallback_writer.py src/telegram_publisher.py \
                   src/content_extras.py VERSION; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "::error::Отсутствует $f"
              ok=0
            fi
          done
          if [ "${ok:-1}" != "1" ]; then
            echo "::error::Структура всё ещё нарушена — запустите «Fix repo layout (one-time)»."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fonts and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          pip install --no-cache-dir -r requirements.txt

      - name: Generate and publish post
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'auto' }}
          CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE || secrets.CHANNEL_HANDLE || '@libra_astra' }}
          TIMEZONE_OFFSET: ${{ vars.TIMEZONE_OFFSET || '3' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERBOSE: "1"
        run: |
          SLOT="${{ github.event.inputs.slot || 'auto' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Выбираем рубрику по точному времени запуска (UTC)
            case "$(date -u +%H:%M)" in
              04:*) SLOT="morning" ;;      # 07:30 МСК — прогноз дня
              06:*) SLOT="moon" ;;         # 09:30 МСК — Луна сегодня
              09:*) SLOT="love" ;;         # 12:30 МСК — Любовь с Весами
              12:*) SLOT="business" ;;     # 15:30 МСК — Бизнес и деньги
              15:*) SLOT="quiz" ;;         # 18:30 МСК — Тест «Какой вы Весы?»
              18:00) SLOT="sex" ;;         # 21:00 МСК — Секс и чувственность
              18:15) SLOT="evening" ;;     # 21:15 МСК — вечерняя ротация
              20:*) SLOT="month_digest" ;; # 23:50 МСК — дайджест месяца (self-guard)
              *)    SLOT="evening" ;;
            esac
          fi

          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          # Автозапуск после правки workflow никогда не публикует пост
          if [ "${{ github.event_name }}" = "push" ]; then
            EXTRA_FLAGS="--dry-run"
            SLOT="auto"
          fi

          echo "::notice::Запуск: slot=$SLOT dry_run=${{ github.event.inputs.dry_run }} token_set=${{ secrets.TG_BOT_TOKEN != '' }} channel_set=${{ secrets.TG_CHANNEL_ID != '' }}"
          echo "::notice::Подпись канала (CHANNEL_HANDLE): '${CHANNEL_HANDLE}'"
          echo "::notice::Рубрика запуска: slot=$SLOT"
          python -m src.main --slot "$SLOT" --verbose $EXTRA_FLAGS

      - name: Save generated preview artifacts
        uses: actions/upload-artifact@v6
        with:
          name: libra-post-preview
          path: output/
          retention-days: 7

      - name: Commit updated anti-repeat history
        if: ${{ github.event_name != 'push' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/history.json)" ]; then
            git add data/history.json
            git commit -m "chore: update astro content history [skip ci]"
            git push
          fi
